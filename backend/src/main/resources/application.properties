spring.application.name=speech-to-text
server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/speech_to_text}
spring.datasource.username=${DB_USERNAME:speech_user}
spring.datasource.password=${DB_PASSWORD:speech_password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:4200}
